<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>Offline · shop.</title>
    <link rel="icon" href="/favicon.svg" />
    <!-- Precached by the service worker and shown when a page can't be loaded offline.
         Self-contained: no external CSS/JS, so it always renders without a connection. -->
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: system-ui, -apple-system, sans-serif; color: #111; background: #fff;
      }
      .box { max-width: 420px; text-align: center; }
      .icon { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 20px; }
      h1 { font-size: 26px; margin-bottom: 10px; }
      p { color: #777; line-height: 1.6; font-size: 15px; }
      .pill { display: inline-flex; align-items: center; gap: 8px; margin: 18px 0 4px; padding: 6px 12px;
        border-radius: 999px; background: #fdecec; color: #b00020; font-size: 13px; font-weight: 600; }
      .pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
      .pill.online { background: #e7f6ec; color: #1a7f37; }
      .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
      .btn { min-height: 44px; padding: 10px 18px; border: 1px solid #111; border-radius: 8px; background: #111;
        color: #fff; font: inherit; font-size: 15px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
      .btn.ghost { background: transparent; color: #111; border-color: #eaeaea; }
      .btn:disabled { opacity: .5; }
      #msg { min-height: 24px; margin-top: 12px; font-size: 14px; }
    </style>
  </head>
  <body>
    <main class="box">
      <img class="icon" src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>This page hasn't been saved for offline use yet. Pages you've already visited and products you've
        already loaded are still available.</p>
      <span id="status" class="pill">Offline</span>
      <div class="actions">
        <button id="retry" class="btn">Retry connection</button>
        <a class="btn ghost" href="/">Go home</a>
      </div>
      <p id="msg" role="status"></p>
    </main>
    <script>
      const status = document.getElementById('status')
      const msg = document.getElementById('msg')
      const retry = document.getElementById('retry')

      function render() {
        status.textContent = navigator.onLine ? 'Online' : 'Offline'
        status.classList.toggle('online', navigator.onLine)
      }

      async function tryReconnect() {
        retry.disabled = true
        msg.textContent = 'Checking connection…'
        try {
          // "ping" requests bypass the service worker caches, so this really hits the network
          const res = await fetch('/manifest.json?ping=' + Date.now(), { cache: 'no-store' })
          if (!res.ok) throw new Error()
          msg.textContent = 'Back online, reloading…'
          location.reload()
        } catch {
          msg.textContent = 'Still offline. Check your connection and try again.'
          retry.disabled = false
        }
      }

      retry.addEventListener('click', tryReconnect)
      addEventListener('online', () => { render(); tryReconnect() })
      addEventListener('offline', render)
      render()
    </script>
  </body>
</html>
